name: 2 - Build signed AAB for Play Store

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/2-build-aab.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI and expect
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get update -y
          sudo apt-get install -y expect

      - name: Tell Bubblewrap where the JDK and Android SDK already are
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      - name: Decode keystore from secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > qusannoo-release.keystore

      - name: Write twa-manifest.json directly (skips interactive init)
        run: |
          mkdir -p twa-project
          cp qusannoo-release.keystore twa-project/
          node -e "
            const fs = require('fs');
            const pwaUrl = '${{ vars.PWA_URL }}';
            const host = new URL(pwaUrl).host;
            const manifest = {
              packageId: 'com.qusannoo.app',
              host: host,
              name: 'Qusannoo',
              launcherName: 'Qusannoo',
              display: 'standalone',
              themeColor: '#4A2E1E',
              navigationColor: '#4A2E1E',
              navigationColorDark: '#1C1712',
              navigationDividerColor: '#4A2E1E',
              navigationDividerColorDark: '#1C1712',
              backgroundColor: '#F1E7D3',
              enableNotifications: false,
              startUrl: '/index.html',
              iconUrl: pwaUrl + '/icons/icon-512.png',
              maskableIconUrl: pwaUrl + '/icons/icon-512.png',
              shortcuts: [],
              generatorApp: 'bubblewrap-cli',
              webManifestUrl: pwaUrl + '/manifest.json',
              fallbackType: 'customtabs',
              features: {},
              alphaDependencies: { enabled: false },
              enableSiteSettingsShortcut: true,
              isChromeOSOnly: false,
              isMetaQuest: false,
              fullScopeUrl: pwaUrl + '/',
              minSdkVersion: 21,
              orientation: 'portrait',
              fingerprints: [],
              additionalTrustedOrigins: [],
              retainedBundles: [],
              appVersionName: '1.0.1',
              appVersionCode: 2,
              signingKey: { path: './qusannoo-release.keystore', alias: 'qusannoo' },
              splashScreenFadeOutDuration: 300
            };
            fs.writeFileSync('twa-project/twa-manifest.json', JSON.stringify(manifest, null, 2));
          "

      - name: Generate the actual Android project files from the manifest
        working-directory: twa-project
        run: |
          cat > ../drive-update.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 600
          spawn bubblewrap update --skipPwaValidation
          expect "(Y/n)"
          send "y\r"
          expect eof
          EOF
          chmod +x ../drive-update.exp
          expect ../drive-update.exp

      - name: Build signed AAB
        working-directory: twa-project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > ../drive-build.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 600
          spawn bubblewrap build --skipPwaValidation
          expect "Password for the Key Store:"
          send "$env(KEYSTORE_PASSWORD)\r"
          expect "Password for the Key:"
          send "$env(KEY_PASSWORD)\r"
          expect eof
          EOF
          chmod +x ../drive-build.exp
          expect ../drive-build.exp

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: qusannoo-release-aab
          path: twa-project/app-release-bundle.aab
