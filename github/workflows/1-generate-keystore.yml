name: Generate signing keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate a random password and the keystore
        run: |
          set -eu
          PW=$(openssl rand -base64 18)
          echo "::add-mask::$PW"
          # Restrict umask so created files are not world-readable
          umask 077
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore qusannoo-release.keystore \
            -alias qusannoo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" \
            -keypass "$PW" \
            -dname "CN=Qusannoo, O=Qusannoo, C=ET"
          printf '%s' "$PW" > password.txt
          chmod 600 password.txt

      - name: Show SHA-256 fingerprint (you will need this for assetlinks.json)
        run: |
          keytool -list -v -keystore qusannoo-release.keystore -storepass "$(cat password.txt)" | grep "SHA256:"

      - name: Base64-encode keystore (portable)
        run: |
          # Try GNU base64 with no wrap; fall back to a portable method
          if command -v base64 >/dev/null 2>&1; then
            if base64 --wrap=0 qusannoo-release.keystore > qusannoo-release.keystore.b64 2>/dev/null; then
              true
            else
              base64 qusannoo-release.keystore | tr -d '\n' > qusannoo-release.keystore.b64
            fi
          else
            openssl base64 -A -in qusannoo-release.keystore -out qusannoo-release.keystore.b64
          fi

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            qusannoo-release.keystore
            qusannoo-release.keystore.b64
            password.txt

      - name: Clean up generated files
        if: always()
        run: |
          # Try to securely remove the password, fall back to plain remove
          if command -v shred >/dev/null 2>&1; then
            shred -u password.txt || rm -f password.txt
          else
            rm -f password.txt
          fi
          rm -f qusannoo-release.keystore qusannoo-release.keystore.b64 || true
