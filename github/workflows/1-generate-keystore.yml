name: 1 - Generate signing keystore (run ONCE)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate a random password and the keystore
        run: |
          PW=$(openssl rand -base64 18)
          echo "::add-mask::$PW"
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore qusannoo-release.keystore \
            -alias qusannoo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" \
            -keypass "$PW" \
            -dname "CN=Qusannoo, OU=Qusannoo, O=Qusannoo, L=Addis Ababa, ST=Addis Ababa, C=ET"
          echo "$PW" > password.txt

      - name: Show SHA-256 fingerprint (you will need this for assetlinks.json)
        run: |
          keytool -list -v -keystore qusannoo-release.keystore -storepass "$(cat password.txt)" | grep "SHA256:"

      - name: Base64-encode keystore
        run: base64 -w0 qusannoo-release.keystore > qusannoo-release.keystore.b64

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            qusannoo-release.keystore
            qusannoo-release.keystore.b64
            password.txt
